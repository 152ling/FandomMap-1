<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>應援地圖 | 演唱會應援與卡片交換平台 </title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.0"></script>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="應援地圖">
  <link rel=stylesheet type="text/css" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-screen">
    <header class="bg-white/90 backdrop-blur-xl py-4 px-6 border-b border-zinc-200/70  top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div id="header-back-btn" class="hidden">
          <button onclick="navigateBack()" class="flex items-center gap-1 text-zinc-500 hover:text-zinc-800 transition-colors">
            <!-- 向左箭頭 SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span class="font-semibold text-sm">返回</span>
          </button>
        </div>
        <div id="header-logo" class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-brand text-white grid place-items-center shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Z" /></svg></span>
          <span class="text-xl md:text-2xl font-extrabold text-zinc-900 tracking-tight">個人中心</span>
        </div>
      </div>

      <!-- 桌機版選單列 (RWD: md 以上顯示) -->
      <div class="hidden md:flex items-center gap-8 border-l border-zinc-200 pl-8 mr-auto">
        <button onclick="switchTab('explore')" id="dk-nav-btn-explore" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          探索場次
        </button>
        <button onclick="switchTab('bookmarks')" id="dk-nav-btn-bookmarks" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          我的收藏
        </button>
        <button onclick="switchTab('profile')" id="dk-nav-btn-profile" class="tab-active text-sm font-bold text-zinc-900 border-b-2 border-zinc-900 pb-1 transition-all ">
          個人中心
        </button>
      </div>

      <div class="flex items-center gap-3">
        <!-- 模擬頭像 -->
        <img id="user-avatar-snapshot" src="https://api.dicebear.com/10.x/glyphs/svg?seed=Tina" alt="avatar" class="w-9 h-9 rounded-full border border-zinc-200 bg-zinc-50 cursor-pointer" onclick="switchTab('profile')">
      </div>
    </header>
    <main id="main-content" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 pb-24 md:pb-12">
      <!-- SCREEN 3: 個人中心與發布管理 -->
      <section id="screen-profile" class="space-y-6 animate-fade-in text-left">
        
        <!-- 大螢幕採用 雙網格排列：左側為名片/設定，右側為貼文管理 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
          
          <div class="lg:col-span-1 space-y-4">
            <!-- Firebase 登入與個人頭像卡 -->
            <div class="border border-zinc-200/80 p-3 rounded-2xl flex flex-col items-center text-center relative overflow-hidden">
              <div class="w-full flex items-start justify-between">
                    <div class="flex items-center space-x-3.5">
                        <!-- Avatar -->
                        <div class="relative group">
                            <img id="profile-display-avatar" src="https://api.dicebear.com/10.x/glyphs/svg?seed=Tina" alt="Avatar" class="w-16 h-16 rounded-full object-cover ring-4 ring-white shadow-md">
                            <button onclick="openProfileModal()" id="btn-edit-avatar" class="absolute bottom-0 right-0 bg-zinc-500 hover:bg-zinc-700 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-sm transition">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                        
                        <div>
                            <div class="flex items-center space-x-2">
                                <h1 id="profile-input-username" class="text-[12px] font-bold text-slate-900">匿名用戶</h1>
                                <span id="auth-status-badge" class="bg-emerald-100 text-emerald-700 text-[10px] font-semibold px-2 py-0.5 rounded-full inline-flex items-center">
                                    <i class="fa-brands fa-google mr-1 text-[9px]"></i> 已驗證
                                </span>
                            </div>
                            
                            <!-- Social Media Handle & Email -->
                            <div class="flex items-center gap-2 mt-1">
                                <a id="user-social-link" href="#" target="_blank" class="text-xs text-violet-600 font-medium hover:underline flex items-center bg-violet-50 px-2 py-0.5 rounded-md border border-violet-100/60">
                                    <i class="fa-brands fa-threads mr-1"></i> <span id="user-social-handle">@--</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[9px] ml-1 opacity-70"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Options Trigger -->
                    <div class="flex items-center space-x-1">
                        <button id="btn-open-settings" onclick="openProfileModal()" title="編輯資料" class="p-2 text-slate-500 hover:text-violet-600 hover:bg-white rounded-xl border border-slate-200/60 shadow-sm transition text-xs font-medium flex items-center">
                            <i class="fa-solid fa-sliders mr-1.5"></i>
                            <span class="text-[10px] inline">設定</span>
                        </button>
                    </div>
                </div>
                 <!-- Personal Stats Summary Grid (演唱會, 發布項目, 總收藏) -->
                <div class="w-full grid grid-cols-3 gap-2.5 mt-4 pt-3 border-t border-slate-200/40">
                    <div class="bg-white/80 backdrop-blur-sm p-2.5 rounded-2xl border border-slate-200 text-center shadow-xs">
                        <div class="text-xs text-slate-400 font-medium">演唱會</div>
                        <div id="user-concert-count" class="text-base font-bold text-slate-900 mt-0.5">0</div>
                    </div>
                    <div class="bg-white/80 backdrop-blur-sm p-2.5 rounded-2xl border border-slate-200 text-center shadow-xs">
                        <div class="text-xs text-slate-400 font-medium">發布項目</div>
                        <div id="user-support-count" class="text-base font-bold text-violet-600 mt-0.5">0</div>
                    </div>
                    <div class="bg-white/80 backdrop-blur-sm p-2.5 rounded-2xl border border-slate-200 text-center shadow-xs">
                        <div class="text-xs text-slate-400 font-medium">總收藏</div>
                        <div id="user-bookmarked-count" class="text-base font-bold text-slate-900 mt-0.5">0</div>
                    </div>
                </div>

              <button onclick="renderAppearanceView()" class="w-full mt-4 bg-brand  text-white font-bold py-2.5 rounded-xl text-xs shadow-sm transition-all">外觀設定</button>

              <!-- Firebase Authentication 互動控制區 -->
              <div class="w-full mt-4 pt-4 border-t border-zinc-200/60">
                <!-- 匿名狀態提示與登入按鈕 -->
                <div id="anonymous-warning-box" class="hidden text-left bg-amber-50 border border-amber-100 text-amber-800 p-3 rounded-xl mb-3 text-[10px] leading-relaxed">
                  登入後才可開始發布應援以及收藏應援
                </div>
                <button id="google-login-btn" onclick="handleGoogleSignIn()" class="w-full bg-white hover:bg-zinc-50 text-zinc-700 font-bold py-2 px-3 rounded-xl text-xs border border-zinc-200 flex items-center justify-center gap-2 active:scale-95 transition-all shadow-sm">
                  <!-- Google 彩色 G Logo SVG -->
                  <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="20" height="20" viewBox="0 0 48 48">
                  <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                  </svg>
                  使用 Google 帳號登入
                </button>

                <button id="logout-btn" onclick="handleSignOut()" class="hidden w-full bg-zinc-100 hover:bg-zinc-200 text-zinc-600 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all mt-2">
                  登出此帳號
                </button>
              </div>
            </div>

          </div>

          <!-- 我的發布與管理 (在大螢幕上佔據 2 欄寬度) -->
          <div class="lg:col-span-2 bg-white border border-zinc-200/80 p-5 rounded-2xl space-y-4">
            <h4 class="text-sm font-bold text-zinc-800 flex items-center gap-1.5">
              我的發布與管理
            </h4>
            <div id="my-posts-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <!-- 動態渲染個人專屬貼文 -->
            </div>
          </div>

        </div>
      </section>
      
        <!-- MODAL 1: 編輯個人資料彈窗 -->
        <div id="profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
            <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4">
                
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-base text-slate-900 flex items-center">
                        <i class="fa-solid fa-user-gear text-violet-600 mr-2"></i> 編輯個人資料
                    </h3>
                    <button onclick="closeProfileModal()" id="btn-close-profile-modal" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <!-- Avatar Preview & Change -->
                    <div class="flex items-center justify-center space-x-4">
                        <div class="relative group">
                          <img id="input-avatar-preview" src="https://api.dicebear.com/10.x/glyphs/svg?seed=Tina" alt="個人頭像" class="w-20 h-20 rounded-full border-2 border-white bg-white shadow-md object-cover">
                          <label for="profile-avatar-file" class="absolute inset-0 rounded-full bg-zinc-900/60 text-white text-[10px] font-bold grid place-items-center opacity-0 group-hover:opacity-100 focus-within:opacity-100 cursor-pointer transition-opacity">更換頭像</label>
                            <label for="profile-avatar-file" 
                                  class="absolute bottom-0 right-0 w-7 h-7 rounded-full bg-violet-500 text-white flex items-center justify-center cursor-pointer shadow-md border-2 border-white hover:bg-violet-600 transition">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                            </label>
                          <input type="file" id="profile-avatar-file" accept="image/*" class="sr-only" onchange="processProfileAvatarUpload(event)">
                        </div>
                    </div>

                    <!-- Display Name Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">顯示名稱</label>
                        <input id="input-display-name" type="text" class="w-full bg-slate-50 border border-slate-200 focus:border-violet-500 rounded-xl px-3.5 py-2 text-xs focus:outline-none transition">
                    </div>

                    <!-- Social Link Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">社群個人檔案連結</label>
                        <input id="input-social-link" type="text" placeholder="https://www.threads.com/@your_name" class="w-full bg-slate-50 border border-slate-200 focus:border-violet-500 rounded-xl px-3.5 py-2 text-xs focus:outline-none transition">
                        <p class="text-[10px] text-slate-400 mt-1">填寫 Threads或Instagram 連結，方便交換應援物時聯絡</p>
                    </div>

                    <!-- Account Info -->
                    <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 space-y-1.5">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">登入帳號</span>
                            <span id="info-account-email" class="font-medium text-slate-700">--</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">UID</span>
                            <div class="flex items-center space-x-1">
                                <span id="info-account-uid" class="font-mono text-[11px] text-slate-600 truncate max-w-[150px]">--</span>
                                <button id="btn-copy-uid" onclick="copyUID()" class="text-violet-600 hover:text-violet-700 p-0.5" title="複製 UID">
                                    <i class="fa-regular fa-copy text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                    <button id="btn-logout" onclick="handleSignOut()" class="text-xs text-red-500 hover:text-red-700 font-medium flex items-center px-2 py-1">
                        <i class="fa-solid fa-right-from-bracket mr-1.5"></i> 登出此帳號
                    </button>

                    <div class="flex items-center space-x-2">
                        <button onclick="closeProfileModal()" id="btn-cancel-profile-modal" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-xl font-medium transition">
                            取消
                        </button>
                        <button onclick="saveUserProfile()" id="btn-save-profile" class="px-4 py-2 text-xs bg-violet-600 hover:bg-violet-700 text-white font-medium rounded-xl shadow-sm transition">
                            儲存變更
                        </button>
                    </div>
                </div>
            </div>
        </div>
      <section id="screen-color">
        <div id="color-container" class="flex-grow overflow-y-auto no-scrollbar pb-36 sm:pb-40">
          <!-- 動態渲染 RWD 外觀設定 -->
        </div>
      </section>
    </main>
            <!-- ==================== MODAL 3: 看板詳細情報彈窗 ==================== -->
    <div id="modal-post-detail" onclick="closePostDetailModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg space-y-4 max-h-[85vh] md:max-h-[80vh] overflow-y-auto shadow-2xl text-left border-t border-zinc-100 overflow-hidden">
         <!-- 頂部導覽列 -->
        <div class="sticky top-0 z-20 flex items-center justify-between px-4 py-3.5 bg-white/90 backdrop-blur-md border-b border-zinc-100">
          <span class="text-xs font-bold tracking-widest text-zinc-400 uppercase">應援詳細頁面</span>
          <div class="flex items-center gap-1">
            <button onclick="closePostDetailModal()" class="text-zinc-400 hover:text-zinc-800 bg-zinc-100 p-1.5 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <!-- 可滾動內容區塊 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-6 space-y-2 pb-6">
          <!-- 應援主圖區域 (黑白灰視覺) -->
          <div class="relative w-full">
            <div class="relative overflow-hidden">
              <!-- 圖片 -->
              <div class="h-60 md:h-70 w-full rounded-xl overflow-hidden border border-zinc-100 bg-zinc-50">
                <img id="detail-item-image" src="" alt="Detail" class="w-full h-full object-cover">
              </div>
              <div id="detail-item-image-gallery" class="hidden flex gap-2 mt-2 overflow-x-auto "></div>
            </div>
          </div>


          <div>
            <div class="flex items-center justify-between">
              <h3 id="detail-item-title" class="text-sm md:text-base font-extrabold text-zinc-900 leading-snug"></h3>       
            </div>
            <div class="flex items-center justify-between">
              <!-- 應援種類 Tags-->
              <div class="flex flex-wrap gap-1.5 max-w-[85%]">
                <div class="flex items-center pb-3">
                  <div id="detail-item-tag" class="flex items-center gap-2"></div>
                </div>
              </div>
              <button id="detail-bookmark-btn" onclick="toggleDetailBookmark()" class="p-1.5 rounded-full hover:bg-zinc-100 transition-all">
                <!-- 愛心 SVG -->
                <svg id="detail-bookmark-heart" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
              </button>
            </div>
            <div id="detail-item-quantity-row" class="text-xs text-zinc-500 mt-1 font-bold"></div>
          </div>
          <div id="detail-item-support-summary" class="hidden rounded-2xl border border-purple-100 bg-purple-50/40 p-3 space-y-3"></div>

          <!-- 連結按鈕 (響應式雙欄排版) -->
          <div class="space-y-2">
            <p class="text-[10px] text-zinc-400 font-bold uppercase section-kicker">原始貼文與位置更新連結</p>
            <div class="grid grid-cols-2 gap-2">
              <div id="detail-link-original-container"></div>
              <div id="detail-link-live-container"></div>
            </div>
          </div>
          <!-- 位置說明 -->

          <div class="p-3 bg-white border border-zinc-200 rounded-xl space-y-1.5">
            <div class="flex items-center gap-1.5 text-xs font-bold text-zinc-400 uppercase tracking-wider">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-navigation-icon lucide-navigation"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
              即時位置更新說明
            </div>
            <p id="detail-item-approx" class="text-xs text-zinc-800 font-medium leading-relaxed"></p>
          </div>

          <!-- 獨立三大說明區塊 -->
          <div class="space-y-2">
            <div class="p-3 bg-white border border-zinc-200 rounded-xl space-y-2 shadow-2xs">
              <div class="flex items-center gap-1.5 text-xs font-bold text-zinc-400 uppercase tracking-wider">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-zinc-700" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
                  領取條件
              </div>
              <div class="text-base text-zinc-900 flex items-center gap-2 pl-1">
                <p id="detail-item-requirement" class="text-xs text-zinc-700 leading-relaxed font-medium"></p>
              </div>
            </div>

            <div class="p-4 bg-zinc-100/80 border border-zinc-200/80 rounded-xl space-y-2">
              <div class="flex items-center gap-1.5 text-xs font-bold text-zinc-800 uppercase tracking-wider">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-alert-icon lucide-circle-alert"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                注意事項
              </div>
              <p id="detail-item-notice" class="text-xs text-zinc-600 mt-1.5 leading-relaxed font-medium"></p>
            </div>
          </div>

          <!-- 操作按鈕 -->
          <div id="detail-action-container" class="border-t border-zinc-100 pt-3">
            <!-- 根據發布者是自己與否渲染 -->
          </div>
        </div>
      </div>
    </div>

        export function toggleDarkMode(isDark) {
            // 套用目前的顏色，但傳入新的深淺設定
            applyTheme(state.themeColor, isDark);
            showToast(isDark ? "開啟深色模式" : "關閉深色模式");
        }
        export function applyHexColor() {
            const hexInput = document.getElementById('custom-hex-input');
            const color = hexInput.value.trim();
            
            // 驗證格式是否為有效的 Hex 色碼 (例如 #FFFFFF 或 #FFF)
            const isHex = /^#([A-Fa-f0-9]{3}){1,2}$/.test(color);
            
            if (isHex) {
                applyTheme(color);
                showToast("顏色已更新"); //更新自訂主題色
            } else {
                showToast("格式錯誤"); //格式錯誤 
            }
        }

        //應用主題顏色
    export function applyTheme(color, isDarkMode = null) {
            state.themeColor = color;
            const root = document.documentElement;
            const body = document.body;

            // --- 深色模式判斷邏輯 ---
            let targetDark;
            
            if (isDarkMode !== null) {
                // 如果有從 saveGrad 傳進來 (true 或 false)，就用傳進來的
                targetDark = isDarkMode;
            } else {
                // 如果是點擊「粉藍」或其他預設顏色（只傳一個參數時），就讀取原本存的狀態
                targetDark = localStorage.getItem('fe_v11_darkMode') === 'true';
            }

            localStorage.setItem('fe_v1_darkMode', targetDark);
            if (targetDark) {
                body.classList.add('dark-mode');
            } else {
                body.classList.remove('dark-mode');
            }

            root.style.setProperty('--brand-color', color);
            
            localStorage.setItem('fe_v1_theme', color);
        }
