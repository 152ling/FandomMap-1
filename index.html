<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>應援地圖 | 演唱會應援與卡片交換平台 </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="./manifest.json">
  <link rel=stylesheet type="text/css" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 自訂 Tailwind 設定與動畫 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(100%)' },
              '100%': { transform: 'translateY(0)' },
            }
          }
        }
      }
    }
    
  </script>
  <style>
    /* 外層容器，設定滿版或固定寬度並隱藏溢出範圍 */
.banner-wrapper {
  position: relative;
  width: 100%;
  max-width: 1200px;
  max-height: 400px;
  margin: 0 auto;
  background-color: #0b0f19; /* 整體深色底色 */
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 底層模糊背景效果 */
.bg-blur {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(5px) brightness(0.4); /* 調整模糊度與明暗 */
  transform: scale(1.2); /* 放大以避免模糊邊緣露出白邊 */
  z-index: -1;
}

/* 確保上層內容壓在模糊背景上方 */
.banner-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}


  </style>
</head>
<body class="bg-zinc-50 text-zinc-800 flex justify-center font-sans antialiased min-h-screen">

  <!-- 連線/初始化 Loading 遮罩 -->
  <div id="loading-overlay" class="fixed inset-0 bg-brand/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white space-y-4">
    <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm font-bold tracking-wide" id="loading-status-text">安全防護連線中...</p>
    <p class="text-[10px] text-zinc-400">正在初始化即時資料庫與身分驗證</p>
  </div>

  <!-- 響應式主外框（手機版滿版、桌機版適配寬螢幕、具備圓角與柔和陰影） -->
  <div class="w-full max-w-7xl bg-white flex flex-col relative min-h-screen md:min-h-[calc(100vh-3rem)] border border-zinc-100 overflow-hidden">
    
    <!-- ==================== TOP HEADER (響應式雙向導覽列) ==================== -->
    <header class="bg-white/90 backdrop-blur-xl py-4 px-6 border-b border-zinc-200/70 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div id="header-back-btn" class="hidden">
          <button onclick="navigateBack()" class="flex items-center gap-1 text-zinc-500 hover:text-zinc-800 transition-colors">
            <!-- 向左箭頭 SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span class="font-semibold text-sm">返回</span>
          </button>
        </div>
        <div id="header-logo" class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-brand text-white grid place-items-center shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Z" /></svg></span>
          <span class="text-xl md:text-2xl font-extrabold text-zinc-900 tracking-tight">應援地圖</span>
        </div>
      </div>

      <!-- 桌機版選單列 (RWD: md 以上顯示) -->
      <div class="hidden md:flex items-center gap-8 border-l border-zinc-200 pl-8 mr-auto">
        <button onclick="switchTab('explore')" id="dk-nav-btn-explore" class="tab-active text-sm font-bold text-zinc-900 border-b-2 border-zinc-900 pb-1 transition-all">
          探索場次
        </button>
        <button onclick="switchTab('bookmarks')" id="dk-nav-btn-bookmarks" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          我的收藏
        </button>
        <button onclick="switchTab('profile')" id="dk-nav-btn-profile" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          個人中心
        </button>
      </div>

      <div class="flex items-center gap-3">
        <!-- 提案新增演唱會按鈕 -->
        <button id="add-concert-btn" onclick="openAddConcertModal()" class="bg-brand text-white text-xs md:text-sm px-3 py-2 rounded-xl font-bold shadow-sm flex items-center gap-1 active:scale-95 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          提案新場次
        </button>
        <!-- 模擬頭像 -->
        <img id="user-avatar-snapshot" src="https://api.dicebear.com/10.x/glyphs/svg?seed=Tina" alt="avatar" class="w-9 h-9 rounded-full border border-zinc-200 bg-zinc-50 cursor-pointer" onclick="switchTab('profile')">
      </div>
    </header>

    <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
    <main id="main-content" class="flex-1 overflow-y-auto md:px-8 pb-24 md:pb-12">
      
      <!-- SCREEN 1: 探索演唱會列表 -->
      <section id="screen-explore" class="space-y-6 animate-fade-in">
        <!-- 宣傳看板 (桌機版適配為優雅通欄) -->
        <div id="announcement-container" class="hidden mx-4 mt-4 bg-gradient-to-r from-violet-50 via-white to-fuchsia-50/50 border border-violet-100/80 p-5 rounded-2xl flex gap-4 items-start ui-card">
          <span class="w-10 h-10 shrink-0 rounded-xl bg-white border border-violet-100 text-violet-700 grid place-items-center shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5 3.75 12l4.5 7.5M15.75 4.5l4.5 7.5-4.5 7.5M12 3v18" /></svg></span>
          <div>
            <h3 class="text-sm font-bold text-zinc-800 md:text-base">即時應援看板與粉絲卡片交換</h3>
            <p class="text-xs text-zinc-500 mt-1 leading-relaxed max-w-3xl">
              探索各場演唱會周邊的熱門應援。每篇貼文皆可設定外部連結（如 IG 原文）與當日即時位置更新處（如 Threads 個人動態），支援即時相片上傳，讓現場排隊不迷路！
            </p>
          </div>
        </div>
        <!-- 本周演唱會輪播圖 -->
        <div id="hero-carousel-container" class="hidden relative w-full overflow-hidden bg-black text-white group">
          <div id="carousel-track" class="flex transition-transform duration-500 ease-out w-full">
            </div>

          <button onclick="prevCarouselSlide()" class="absolute left-1 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/40 hover:bg-black/70 backdrop-blur-md text-white grid place-items-center opacity-40 group-hover:opacity-100 transition-opacity z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button onclick="nextCarouselSlide()" class="absolute right-1 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/40 hover:bg-black/70 backdrop-blur-md text-white grid place-items-center opacity-40 group-hover:opacity-100 transition-opacity z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <div id="carousel-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-10">
            </div>
        </div>

        <!-- 搜尋與篩選列 (RWD: 在大螢幕下更顯大器) -->
        <div class="relative max-w-xl px-4">
          <span class="absolute inset-y-0 left-0 flex items-center pl-6 text-zinc-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd" />
            </svg>
          </span>
          <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="輸入明星藝人、演出場館或巡演名稱..." class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl py-3 pl-11 pr-4 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-brand text-zinc-800 transition-all">
        </div>

        <!-- 熱門演唱會列表 -->
        <div class="space-y-4  px-4 ">
          <h3 class="text-zinc-500 text-xs font-bold uppercase section-kicker">熱門演出看板</h3>
          <div id="concert-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
            <!-- 動態渲染 RWD 卡片 -->
          </div>
        </div>
      </section>

      <section id="screen-color">
        <div id="color-container" class="flex-grow overflow-y-auto no-scrollbar pb-36 sm:pb-40">
          <!-- 動態渲染 RWD 外觀設定 -->
        </div>
      </section>

    </main>

    <!-- ==================== 底部行動導覽列 (僅在手機 md 以下顯示) ==================== -->
    <nav id="bottom-nav-bar" class="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-xl border-t border-zinc-200/70 z-30 flex py-2 px-6 justify-between items-center shadow-[0_-6px_24px_rgba(15,23,42,0.06)] pb-safe">
      <button onclick="switchTab('explore')" id="nav-btn-explore" class="tab-active flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-zinc-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3 9 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" /></svg>
        <span class="text-[10px] font-bold">探索場次</span>
      </button>
      <button onclick="switchTab('bookmarks')" id="nav-btn-bookmarks" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-zinc-400 hover:text-zinc-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z" /></svg>
        <span class="text-[10px] font-bold">我的收藏</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-btn-profile" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-zinc-400 hover:text-zinc-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
        <span class="text-[10px] font-bold">個人中心</span>
      </button>
    </nav>

    <!-- 懸浮發布按鈕 (只限於詳細頁顯示) -->
    <button id="floating-publish-btn" onclick="openPublishModal()" class="hidden fixed bottom-24 right-6 md:absolute md:bottom-8 md:right-8 z-45 w-14 h-14 md:w-16 md:h-16 rounded-full bg-brand text-white shadow-xl flex items-center justify-center active:scale-95 transition-all ">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </button>

    <!-- ==================== TOAST 通知 ==================== -->
    <div id="toast-container" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-[100] w-11/12 max-w-sm bg-brand backdrop-blur-md text-white px-4 py-3.5 rounded-2xl shadow-xl flex items-center justify-center gap-2 animate-fade-in text-xs font-bold">
      <span id="toast-text"></span>
    </div>

    <!-- ==================== MODAL 1: 提案新增場次 ==================== -->
    <div id="modal-add-concert" onclick="closeAddConcertModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[90vh] md:max-h-[85vh] overflow-y-auto text-left shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
          <h3 class="text-sm md:text-base font-black text-zinc-850">提案新增演出</h3>
          <button onclick="closeAddConcertModal()" class="text-zinc-400 hover:text-zinc-800 bg-zinc-100 p-1.5 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <form onsubmit="handleAddConcertSubmit(event)" class="space-y-3.5 text-xs">
          <div>
            <label class="block text-zinc-500 font-bold mb-1">上傳演唱會圖片/海報<span class="text-red-500">*</span></label>
            <input type="file" id="add-concert-image-file" accept="image/*" class="hidden" onchange="processConcertImageUpload(event)">
            
            <div id="add-concert-image-preview-box" class="hidden relative w-full h-36 rounded-xl border border-zinc-200 overflow-hidden bg-zinc-50 mb-2">
              <img id="add-concert-image-preview" src="" alt="預覽圖片" class="w-full h-full object-cover">
              <button type="button" onclick="clearConcertUploadedImage()" class="absolute top-2 right-2 w-6 h-6 rounded-full bg-brand/70 text-white flex items-center justify-center text-xs hover:bg-brand transition">
                ✕
              </button>
            </div>

            <button type="button" onclick="document.getElementById('add-concert-image-file').click()" class="w-full bg-zinc-50 hover:bg-zinc-100 border border-dashed border-zinc-300 rounded-xl py-3 text-zinc-600 font-bold flex items-center justify-center gap-1.5 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span id="add-concert-upload-btn-text">上傳圖片</span>
            </button>
          </div>

          <div>
            <label class="block text-zinc-500 font-bold mb-1">明星藝人名稱<span class="text-red-500">*</span></label>
            <input type="text" id="add-concert-artist" placeholder="例如: SEVENTEEN, IU, AESPA" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required>
          </div>
          <div>
            <label class="block text-zinc-500 font-bold mb-1">巡迴演唱會全稱<span class="text-red-500">*</span></label>
            <input type="text" id="add-concert-tour" placeholder="例如: WORLD TOUR [RIGHT HERE] IN TAIPEI" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required>
          </div>
          <div>
            <label class="block text-zinc-500 font-bold mb-1">演出場館<span class="text-red-500">*</span></label>
            <input type="text" id="add-concert-venue" placeholder="例如: 台北大巨蛋, 高雄巨蛋" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-zinc-600 font-bold">演唱會場次日期<span class="text-red-500">*</span></label>
              <button type="button" onclick="addConcertDateField()" class="text-[11px] text-zinc-900 bg-zinc-100 hover:bg-zinc-200 font-bold px-2.5 py-1 rounded-lg transition flex items-center space-x-1">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>增加天數</span>
              </button>
            </div>
            <div id="add-concert-dates-container" class="space-y-2">
              <!-- 由 JS resetConcertDateFields 自動載入 -->
            </div>
          </div>
          <button type="submit" class="w-full bg-brand hover:bg-zinc-800 text-white font-black py-3 rounded-xl transition-colors shadow-sm mt-2">確認建立演出</button>
        </form>
      </div>
    </div>

    <!-- ==================== MODAL: 管理員編輯演出 ==================== -->
    <div id="modal-edit-concert" onclick="closeEditConcertModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[90vh] md:max-h-[85vh] overflow-y-auto text-left shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
          <div><h3 class="text-sm md:text-base font-black text-zinc-850">編輯演出資訊</h3><p class="text-[10px] text-zinc-500 mt-0.5">僅限已驗證管理員</p></div>
          <button type="button" onclick="closeEditConcertModal()" class="text-zinc-400 hover:text-zinc-800 bg-zinc-100 p-1.5 rounded-full" aria-label="關閉編輯視窗">✕</button>
        </div>
        <form onsubmit="handleEditConcertSubmit(event)" class="space-y-3.5 text-xs">
          <div>
            <label class="block text-zinc-500 font-bold mb-1">演唱會圖片／海報</label>
            <input type="file" id="edit-concert-image-file" accept="image/*" class="hidden" onchange="processEditConcertImageUpload(event)">
            <div class="relative w-full h-36 rounded-xl border border-zinc-200 overflow-hidden bg-zinc-50 mb-2"><img id="edit-concert-image-preview" src="" alt="演唱會圖片預覽" class="w-full h-full object-cover"></div>
            <button type="button" onclick="document.getElementById('edit-concert-image-file').click()" class="w-full bg-zinc-50 hover:bg-zinc-100 border border-dashed border-zinc-300 rounded-xl py-3 text-zinc-600 font-bold">更換圖片</button>
          </div>
          <div><label class="block text-zinc-500 font-bold mb-1">明星藝人名稱<span class="text-red-500">*</span></label><input type="text" id="edit-concert-artist" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div><label class="block text-zinc-500 font-bold mb-1">巡迴演唱會全稱<span class="text-red-500">*</span></label><input type="text" id="edit-concert-tour" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div><label class="block text-zinc-500 font-bold mb-1">演出場館<span class="text-red-500">*</span></label><input type="text" id="edit-concert-venue" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div>
            <div class="flex items-center justify-between mb-1.5"><label class="block text-zinc-600 font-bold">演唱會場次日期<span class="text-red-500">*</span></label><button type="button" onclick="addEditConcertDateField()" class="text-[11px] text-zinc-900 bg-zinc-100 hover:bg-zinc-200 font-bold px-2.5 py-1 rounded-lg">增加天數</button></div>
            <div id="edit-concert-dates-container" class="space-y-2"></div>
          </div>
          <div class="pt-2 border-t border-zinc-100">
            <button type="button" onclick="confirmDeleteConcert()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-xl transition-colors shadow-sm">刪除演唱會</button>
          </div>

    // ==================== STREAMING_CHUNK: 開啟 Firestore 三大即時監聽即時更新 ====================
    let initialDataLoaded = {

      unsubscribeListeners(); // 確保重新開啟前先清理

      }, (err) => {

        let list = [];

          list.push({ id: doc.id, ...doc.data() });
        });
        state.supportEvents = list;
        localStorage.setItem("fe_v1_supportEvents",JSON.stringify(state.supportEvents));
        
        initialDataLoaded.supportEvents = true;

      }, (err) => {

      // 3. Exchange Posts 監聽
      const exchangesCol = collection(db, 'artifacts', appId, 'public', 'data', 'exchangePosts');

        state.exchangePosts = list;

        initialDataLoaded.exchangePosts = true;

      }, (err) => {

      if(user){

        const uid = user.uid;

          state.bookmarkedPostIds = [];

          snap.forEach(docSnap => {

    function tryInitialRender() {

    // ==================== 輪播展演 (Carousel) 邏輯 ====================
    let currentSlideIndex = 0;
    let carouselTimer = null;
    let upcomingConcertsCount = 0;

    /**
     * 檢查演唱會日期陣列，判斷是否有任何日期落於未來 7 天內 (今天 00:00 ~ 第 7 天 23:59:59)
     */
    function isConcertInNext7Days(datesArray) {
      if (!Array.isArray(datesArray) || datesArray.length === 0) return false;

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      
      // 未來 7 天的結束時間 (7 天後的 23:59:59)
      const endOf7Days = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7, 23, 59, 59, 999).getTime();

      return datesArray.some(dateStr => {
        const targetDate = new Date(dateStr).getTime();
        return !isNaN(targetDate) && targetDate >= startOfToday && targetDate <= endOf7Days;
      });
    }


    /** 渲染本週熱門演唱會輪播圖*/
    function renderHeroCarousel(concertsData) {
      const container = document.getElementById('hero-carousel-container');
      const announcement = document.getElementById('announcement-container');
      const track = document.getElementById('carousel-track');
      const dotsContainer = document.getElementById('carousel-dots');

      if (!container || !track || !dotsContainer) return;

      // 清空自動播放定時器
      stopCarouselAutoPlay();

      // 1. 防呆過濾：篩選出 dates 中有落在未來 7 天內的演唱會
      const upcomingConcerts = concertsData.filter(c => isConcertInNext7Days(c.dates));
      upcomingConcertsCount = upcomingConcerts.length;
      // 防呆判斷：若未來七天內沒有演唱會，隱藏輪播卡片並退出
      if (upcomingConcertsCount === 0) {
        container.classList.add('hidden');
        announcement.classList.remove('hidden');
        return;
      }else {
        announcement.classList.add('hidden');
      }

      // 有資料時取消隱藏
      container.classList.remove('hidden');
      currentSlideIndex = 0;

      // 2. 渲染 Slides 內容
      track.innerHTML = upcomingConcerts.map((concert) => {
        const datesText = Array.isArray(concert.dates) ? concert.dates.join(', ') : (concert.date || '');
        const bannerImg = concert.image;
        const countdownText = getDaysRemaining(concert.dates);
        return `
          <div class="w-full flex-shrink-0 relative h-48 sm:h-64 md:h-64 overflow-hidden cursor-pointer" onclick="window.location.href = 'Concert.html?concertId=' + '${concert.id}';">
             <!-- 底層：被放大並模糊的背景圖 -->
            <div class="bg-blur" style="background-image: url('${bannerImg}');"></div>
            <div class="banner-content mt-2.5">
              <img src="${bannerImg}" alt="${concert.tourName}" class="main-image w-[80%] sm:w-[70%] md:w-[60%] lg:w-[50%] h-32 sm:h-48 md:h-48 lg:h-48 z-10 h-full object-cover transform transition-transform duration-700">
              <div class="banner-title mt-2 text-sm font-bold text-white text-center">${concert.tourName}</div>
            </div>
          </div>

        `;
      }).join('');

      // 3. 渲染底部指示圓點 (Dots)
      dotsContainer.innerHTML = upcomingConcerts.map((_, idx) => `
        <button onclick="goToCarouselSlide(${idx})" class="w-2 h-2 rounded-full transition-all ${idx === 0 ? 'bg-white w-5' : 'bg-white/40 hover:bg-white/70'}"></button>
      `).join('');

      // 4. 更新軌道位置與開啟自動輪播
      updateCarouselPosition();
      startCarouselAutoPlay();

      // 滑鼠懸停暫停、離開繼續播放
      container.onmouseenter = stopCarouselAutoPlay;
      container.onmouseleave = startCarouselAutoPlay;
    }

    function updateCarouselPosition() {
      const track = document.getElementById('carousel-track');
      const dotsContainer = document.getElementById('carousel-dots');
      if (!track) return;

      track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

      if (dotsContainer) {
        const dots = dotsContainer.children;
        Array.from(dots).forEach((dot, idx) => {
          if (idx === currentSlideIndex) {
            dot.className = 'w-5 h-2 rounded-full bg-white transition-all';
          } else {
            dot.className = 'w-2 h-2 rounded-full bg-white/40 hover:bg-white/70 transition-all';
          }
        });
      }
    }

    function nextCarouselSlide() {
      if (upcomingConcertsCount === 0) return;
      currentSlideIndex = (currentSlideIndex + 1) % upcomingConcertsCount;
      updateCarouselPosition();
    }


    function prevCarouselSlide() {
      if (upcomingConcertsCount === 0) return;
      currentSlideIndex = (currentSlideIndex - 1 + upcomingConcertsCount) % upcomingConcertsCount;
      updateCarouselPosition();
    }

    function goToCarouselSlide(index) {
        currentSlideIndex = index;
        updateCarouselPosition();
      }

      function startCarouselAutoPlay() {
        if (upcomingConcertsCount <= 1) return; // 只有1張或0張時不啟動輪播
        stopCarouselAutoPlay();
        carouselTimer = setInterval(nextCarouselSlide, 4000); // 4秒自動輪播
      }

      function stopCarouselAutoPlay() {
        if (carouselTimer) {
          clearInterval(carouselTimer);

        if (filtered.length === 0) {
          container.className = "block";
          container.innerHTML = `
            <div class="text-center py-16 text-zinc-400 bg-zinc-50 rounded-2xl border border-zinc-100">
              <p class="text-xs">找不到相符場次。您可以點擊右上角「提案新場次」自行建立！</p>
            </div>
          `;
          return;
        }

        filtered.forEach(c => {

          card.className = "bg-white hover:bg-zinc-50 border border-zinc-150 rounded-xl overflow-hidden cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-md flex flex-row";
          card.onclick = () => {window.location.href = `Concert.html?concertId=${c.id}`;};
          card.innerHTML = `
            <div class="w-40 md:w-48 h-[100px] shrink-0 overflow-hidden relative border-r border-zinc-100 bg-zinc-100">
              <img src="${c.image}" alt="${c.artist}" class="w-full h-full rounded-xl object-cover">
              ${c.isPending ? `
                <span class="absolute top-2 left-2 bg-amber-500 text-white text-[8px] md:text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">
                  審核中
                </span>
              ` : ""}
            </div>
            <div class="flex-1 flex flex-col justify-between min-w-0 text-left mt-1 mb-1 ml-2">
              <div>
                <span class="hidden text-zinc-800 text-xs font-black bg-zinc-100 px-2 py-0.5 rounded">${c.artist}</span>
                <h4 class="text-xs md:text-sm font-bold text-zinc-800 tour-name-2line mt-1.5">${c.tourName}</h4>
                <p class="text-[10px] md:text-xs text-zinc-500 mt-1">${c.venue} · ${c.dates.length} Days</p>
              </div>
              <div class="flex gap-3 text-[10px] md:text-xs text-zinc-500 border-t border-zinc-50 pt-2.5 font-semibold">
                <span class="flex items-center gap-1">應援 ${supportCount}</span>
                <span class="text-zinc-200">|</span>
                <span class="flex items-center gap-1">交換 ${exchangeCount}</span>
                <span class="text-zinc-200">|</span>
                <span class="flex items-center gap-1">參加 ${c.attendedCount || 0}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }
      // ==================== STREAMING_CHUNK: 收藏夾清單 RWD 渲染 ====================

      async function loadBookmarkedConcerts() {
          // 每次 bookmark 更新時重新建立
          state.bookmarkedConcerts = {};
          const concertIds = [
              ...new Set(Object.values(state.bookmarkData).map(bookmark => bookmark.concertId).filter(Boolean))
          ];
          if (concertIds.length === 0) {
              return;
          }
          const results = await Promise.all(
              concertIds.map(async (concertId) => {
                  try {
                      const concertRef = doc(db,'artifacts',appId,'public','data','concerts',concertId);
                      const concertSnap = await getDoc(concertRef);
                      if (!concertSnap.exists()) {
                          console.warn(`找不到收藏對應的演唱會：${concertId}`);
                          return null;
                      }
                      return {
                          id: concertSnap.id,
                          ...concertSnap.data()
                      };

                  } catch (error) {
                      console.error(`載入演唱會 ${concertId} 失敗：`,error);
                      return null;
                  }
              })
          );
          results.forEach(concert => {
              if (concert) {
                  state.bookmarkedConcerts[concert.id] = concert;
              }
          });
      }
