<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>應援地圖 | 演唱會應援與卡片交換平台 </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="應援地圖">
  <link rel=stylesheet type="text/css" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #detail-concert-image {
      background: linear-gradient(135deg, #f4f4f5, #e4e4e7);
      transition: opacity 0.25s ease;
      opacity: 0;
    }
    #detail-concert-image.loaded {
      opacity: 1;
    }
  </style>
</head>
<body class="h-screen">
      <!-- 響應式主外框（手機版滿版、桌機版適配寬螢幕、具備圓角與柔和陰影） -->
  <div class="w-full max-w-7xl bg-white flex flex-col relative min-h-screen md:min-h-[calc(100vh-3rem)] border border-zinc-100 overflow-hidden">
    <!-- ==================== TOP HEADER (響應式雙向導覽列) ==================== -->
    <header class="bg-white/90 backdrop-blur-xl py-4 px-6 border-b border-zinc-200/70 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div id="header-back-btn" class="hidden">
          <button onclick="navigateBack()" class="flex items-center gap-1 text-zinc-500 hover:text-zinc-800 transition-colors">
            <!-- 向左箭頭 SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span class="font-semibold text-sm">返回</span>
          </button>
        </div>
        <div id="header-logo" class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-brand text-white grid place-items-center shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="app-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Z" /></svg></span>
          <span class="text-xl md:text-2xl font-extrabold text-zinc-900 tracking-tight">應援地圖</span>
        </div>
      </div>

      <!-- 桌機版選單列 (RWD: md 以上顯示) -->
      <div class="hidden md:flex items-center gap-8 border-l border-zinc-200 pl-8 mr-auto">
        <button onclick="switchTab('explore')" id="dk-nav-btn-explore" class="tab-active text-sm font-bold text-zinc-900 border-b-2 border-zinc-900 pb-1 transition-all">
          探索場次
        </button>
        <button onclick="switchTab('bookmarks')" id="dk-nav-btn-bookmarks" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          我的收藏
        </button>
        <button onclick="switchTab('profile')" id="dk-nav-btn-profile" class="text-sm font-medium text-zinc-400 hover:text-zinc-600 pb-1 transition-all">
          個人中心
        </button>
      </div>

      <div class="flex items-center gap-3">
        <!-- 模擬頭像 -->
        <img id="user-avatar-snapshot" src="https://api.dicebear.com/10.x/glyphs/svg?seed=Tina" alt="avatar" class="w-9 h-9 rounded-full border border-zinc-200 bg-zinc-50 cursor-pointer" onclick="switchTab('profile')">
      </div>
    </header>

    <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 pb-24 md:pb-12">
    <!-- SCREEN: 演唱會看板詳細頁 -->
      <section id="screen-concert-detail" class="space-y-6 animate-fade-in">
        <!-- 演唱會頭部 Banner -->
        <div class="bg-white border border-zinc-200/90 rounded-2xl overflow-hidden ui-card">
          <!-- 1. 上方純海報視覺 Banner (無混亂文字重疊，維持高質感) -->
          <div class="relative h-44 sm:h-52 w-full overflow-hidden bg-brand">
            <img id="detail-concert-image" src="" alt="Poster" class="w-full h-full object-cover">
          </div>
          <!-- 2. 下方獨立資訊與操作按鈕卡片區塊 (獨立白底，清晰高對比) -->
          <div class="p-4 sm:p-5 space-y-1">
            <!-- 地點與參戰 Badge -->
            <div class="flex items-center justify-between text-xs flex-wrap">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-location-dot text-rose-500"></i>
                <span id="detail-concert-venue" class="text-zinc-500 font-bold flex items-center gap-1 text-[11px]">
                  場館資訊
                </span>
              </div>
              <span id="detail-concert-countdown" class="text-zinc-400 font-bold text-[11px]">
                倒數幾天
              </span>
            </div>

            <!-- 演唱會主標題 -->
            <h2 id="detail-concert-tour" class="text-base sm:text-lg font-black text-zinc-900 leading-snug tracking-tight">
              巡迴演唱會全稱
            </h2>
            <span id="detail-concert-artist" class="text-[11px] text-zinc-500 font-bold tracking-wide uppercase">
                ARTIST
            </span>

            <!-- 參加人數統計與獨立操作按鈕列 -->
            <div id="detail-concert-attend-container" class="pt-2 border-t border-zinc-100 flex items-center justify-between gap-2">
              <!-- 左側：參戰數據 -->
              <div class="text-[11px] text-zinc-500 font-medium flex items-center gap-1.5 shrink-0">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>已加入：<strong id="detail-attend-count" class="text-zinc-900 font-black text-xs">0</strong> 人</span>
              </div>

              <!-- 右側：獨立操作按鈕組 -->
              <div class="flex items-center gap-2">
                <button id="btn-detail-attend" onclick="toggleConcertAttend()" class="bg-brand text-white text-[11px] px-3.5 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-all active:scale-95 shadow-sm">
                  <i id="detail-attend-icon" class="fa-solid fa-ticket text-amber-400"></i>
                  <span id="detail-attend-text">標記為已參加</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 審核中提案提示區 -->
        <div id="detail-concert-pending-box" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center justify-between text-xs text-amber-800">
          <div class="space-y-0.5">
            <p class="font-bold text-sm">本場次由粉絲自行提案</p>
            <p>協助確認此場演唱會資訊正確<br>完成驗證後將正式開放</p>
            <p id="detail-concert-pending-stats" class="text-zinc-500 text-[11px]"></p>
          </div>
          <button onclick="voteForConcert()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3.5 py-2 rounded-xl transition-colors shadow-sm">
            確認資訊正確
          </button>

        </div>
        <div id="admin-concert-actions" class="hidden flex flex-wrap gap-2">
          <button id="admin-edit-concert-btn" onclick="openEditConcertModal()" class="text-sm bg-sky-600 text-white font-bold px-3.5 py-2 rounded-xl transition-colors shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-pen-to-square"></i><span>編輯演出資訊</span>
          </button>
          <button id="admin-approve-btn" onclick="adminApproveConcert()" class="hidden text-sm bg-emerald-600 text-white font-bold px-3.5 py-2 rounded-xl transition-colors shadow-sm flex items-center space-x-1">
              <span>直接通過</span>
          </button>
        </div>

        <!-- 雙欄桌面視圖佈局：左側面板放置篩選、右側展示對應卡片 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start text-left">
          
          <div class="lg:col-span-1 space-y-5">
            <!-- 日期選擇 -->
            <div class="bg-zinc-50/50 p-4 rounded-2xl border border-zinc-200/50">
              <p class="text-zinc-500 text-[11px] font-bold mb-2.5 uppercase section-kicker">選擇演唱會日</p>
              <div id="detail-date-tabs-container" class="flex lg:flex-col gap-2 overflow-x-auto pb-1 lg:pb-0">
                <!-- 動態渲染日期卡 -->
              </div>
            </div>

            <!-- 看板分類切換 -->
            <div class="flex lg:flex-col bg-zinc-100 lg:bg-transparent p-1 lg:p-0 rounded-xl lg:space-y-2">
              <button onclick="setSubCategory('support')" id="btn-toggle-support" class="flex-1 py-2.5 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center lg:justify-start lg:px-4 gap-2 transition-all bg-white text-zinc-900 shadow-sm lg:border lg:border-zinc-200">
                <div id="label-toggle-support">免費應援 (0)</div>
              </button>
              <button onclick="setSubCategory('exchange')" id="btn-toggle-exchange" class="flex-1 py-2.5 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center lg:justify-start lg:px-4 gap-2 transition-all text-zinc-500 lg:border lg:border-transparent">
                <span id="label-toggle-exchange">交換應援 (0)</span>
              </button>
            </div>
          </div>

          <!-- 右側動態應援項目網格 -->
          <div class="lg:col-span-3">
            <div id="detail-event-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- 動態渲染卡片 -->
            </div>
          </div>

        </div>
      </section>



    </main>
    <!-- 懸浮發布按鈕 (只限於詳細頁顯示) -->
    <button id="floating-publish-btn" onclick="openPublishModal()" class="hidden fixed bottom-24 right-6 md:absolute md:bottom-8 md:right-8 z-45 w-14 h-14 md:w-16 md:h-16 rounded-full bg-brand text-white shadow-xl flex items-center justify-center active:scale-95 transition-all ">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </button>

    <!-- ==================== TOAST 通知 ==================== -->
    <div id="toast-container" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-[100] w-11/12 max-w-sm bg-brand backdrop-blur-md text-white px-4 py-3.5 rounded-2xl shadow-xl flex items-center justify-center gap-2 animate-fade-in text-xs font-bold">
      <span id="toast-text"></span>
    </div>
    <!-- ==================== MODAL: 管理員編輯演出 ==================== -->
    <div id="modal-edit-concert" onclick="closeEditConcertModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[90vh] md:max-h-[85vh] overflow-y-auto text-left shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
          <div><h3 class="text-sm md:text-base font-black text-zinc-850">編輯演出資訊</h3><p class="text-[10px] text-zinc-500 mt-0.5">僅限已驗證管理員</p></div>
          <button type="button" onclick="closeEditConcertModal()" class="text-zinc-400 hover:text-zinc-800 bg-zinc-100 p-1.5 rounded-full" aria-label="關閉編輯視窗">✕</button>
        </div>
        <form onsubmit="handleEditConcertSubmit(event)" class="space-y-3.5 text-xs">
          <div>
            <label class="block text-zinc-500 font-bold mb-1">演唱會圖片／海報</label>
            <input type="file" id="edit-concert-image-file" accept="image/*" class="hidden" onchange="processEditConcertImageUpload(event)">
            <div class="relative w-full h-36 rounded-xl border border-zinc-200 overflow-hidden bg-zinc-50 mb-2"><img id="edit-concert-image-preview" src="" alt="演唱會圖片預覽" class="w-full h-full object-cover"></div>
            <button type="button" onclick="document.getElementById('edit-concert-image-file').click()" class="w-full bg-zinc-50 hover:bg-zinc-100 border border-dashed border-zinc-300 rounded-xl py-3 text-zinc-600 font-bold">更換圖片</button>
          </div>
          <div><label class="block text-zinc-500 font-bold mb-1">明星藝人名稱<span class="text-red-500">*</span></label><input type="text" id="edit-concert-artist" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div><label class="block text-zinc-500 font-bold mb-1">巡迴演唱會全稱<span class="text-red-500">*</span></label><input type="text" id="edit-concert-tour" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div><label class="block text-zinc-500 font-bold mb-1">演出場館<span class="text-red-500">*</span></label><input type="text" id="edit-concert-venue" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg py-2 px-3 text-zinc-800" required></div>
          <div>
            <div class="flex items-center justify-between mb-1.5"><label class="block text-zinc-600 font-bold">演唱會場次日期<span class="text-red-500">*</span></label><button type="button" onclick="addEditConcertDateField()" class="text-[11px] text-zinc-900 bg-zinc-100 hover:bg-zinc-200 font-bold px-2.5 py-1 rounded-lg">增加天數</button></div>
            <div id="edit-concert-dates-container" class="space-y-2"></div>
          </div>
          <div class="pt-2 border-t border-zinc-100">
            <button type="button" onclick="confirmDeleteConcert()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-xl transition-colors shadow-sm">刪除演唱會</button>
          </div>
          <button id="edit-concert-submit-btn" type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-black py-3 rounded-xl transition-colors shadow-sm mt-2">儲存變更</button>
        </form>
      </div>
    </div>

    <div id="modal-delete-concert-confirm" onclick="closeDeleteConcertConfirmModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-[60] flex items-center justify-center p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl text-center border border-zinc-100">
        <div class="mx-auto w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h3 class="text-base font-black text-zinc-900">確認刪除演唱會？</h3>
          <p class="text-xs text-zinc-500 mt-2 leading-relaxed">此動作將永久移除此場次資料，刪除後不可復原。</p>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="closeDeleteConcertConfirmModal()" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 py-2.5 rounded-xl font-bold transition-all">取消</button>
          <button type="button" onclick="confirmDeleteConcertFromModal()" class="bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold transition-all shadow-sm">確認刪除</button>
        </div>
      </div>
    </div>
    <!-- ==================== MODAL 2: 發布與編輯應援/交換貼文 ==================== -->
    <div id="modal-publish-post" onclick="closePublishModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in">
      <div onclick="event.stopPropagation()" class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg space-y-4 max-h-[90vh] md:max-h-[85vh] overflow-y-auto text-left shadow-2xl overflow-hidden">
        <!-- 頂部導覽列 -->
        <div class="sticky top-0 z-20 flex items-center justify-between px-6 py-3.5 bg-white/90 backdrop-blur-md border-b border-zinc-100">
          <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
              <h3 id="publish-modal-title" class="text-sm md:text-base font-black text-zinc-850">發布新看板項目</h3>
              <span id="publish-edit-badge" class="hidden text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-black">僅限自己編輯</span>
            </div>
            <button onclick="closePublishModal()" class="text-zinc-400 hover:text-zinc-800 bg-zinc-100 p-1.5 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>
        </div>
        <!-- 可滾動內容區塊 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-6 space-y-2 pb-6">
          <!-- 類型切換 (僅新增模式下顯示) -->
          <div id="publish-type-toggle-container" class="flex bg-zinc-100 p-1 rounded-xl">
            <button type="button" id="publish-type-btn-free-support" onclick="setPublishType('free-support')" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all bg-white text-zinc-850 shadow-xs">
              免費應援
            </button>
            <button type="button" id="publish-type-btn-support-exchange" onclick="setPublishType('support-exchange')" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all text-zinc-400">
              交換應援
            </button>
          </div>

          <form onsubmit="handlePublishPostSubmit(event)" class="space-y-3.5 text-xs text-zinc-800">
            <div>
              <label id="label-post-title" class="block text-zinc-500 font-bold mb-1">應援物標題<span class="text-red-500">*</span></label>
              <input type="text" id="post-title" placeholder="例:oo吊飾、oo杯套" class="w-full bg-white border border-zinc-200 rounded-lg py-2.5 px-3 text-zinc-800" required>
            </div>

            <!-- 應援相片上傳區 (現場拍照/上傳、自動安全等比 Canvas 壓縮) -->
            <div>
              <label class="block text-zinc-500 font-bold mb-1">上傳實體照片<span class="text-red-500">*</span></label>
              <div>
                <button type="button" onclick="triggerFileInput()" class="hidden">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  上傳圖片
                </button>
                <input type="file" id="post-image-file" accept="image/*" multiple class="hidden" onchange="processImageUpload(event)">
                <div id="image-upload-preview-container" class="flex items-center gap-3 overflow-x-auto pb-1"></div>
          
                <p id="image-upload-hint" class="text-[9px] text-zinc-400"></p>
              </div>
            </div>

            <div id="support-only-fields" class="flex flex-col gap-y-4">
              <div>
                <label class="block text-zinc-500 font-bold mb-1">應援種類（可複選）<span class="text-red-500">*</span></label>
                
                <div id="support-category-options" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">
                      <input type="checkbox" value="吊飾" class="rounded text-accentBrand focus:ring-accentBrand w-4 h-4">
                      <span class="text-xs font-medium text-neutralDark">吊飾</span>
                    </label>
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">
                      <input type="checkbox" value="卡片" class="rounded text-accentBrand focus:ring-accentBrand w-4 h-4">
                      <span class="text-xs font-medium text-neutralDark">卡片</span>
                    </label>
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">
                        <input type="checkbox" value="杯套" class="rounded text-accentBrand focus:ring-accentBrand w-4 h-4">
                        <span class="text-xs font-medium text-neutralDark">杯套</span>
                    </label>
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">
                        <input type="checkbox" value="貼紙" class="rounded text-accentBrand focus:ring-accentBrand w-4 h-4">
                        <span class="text-xs font-medium text-neutralDark">貼紙</span>
                    </label>
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">
                        <input type="checkbox" value="布類" class="rounded text-accentBrand focus:ring-accentBrand w-4 h-4">
                        <span class="text-xs font-medium text-neutralDark">布類</span>
                    </label>
                    <label class="flex items-center space-x-2.5 p-3 bg-zinc-50 border border-borderSubtle rounded-xl cursor-pointer hover:border-accentBrand transition-colors">

        import { state } from './js/state.js';
        import {hasAdminClaim,isAdminClaimResolved,isUserAdmin,navigateBack,switchTab,showToast,getDaysRemaining} from "./js/common.js";
        import './js/color.js';

        import { getAuth, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection,increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { query,where,getCountFromServer,getDocs} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject,listAll } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        window.onload = () => {
            applyTheme(state.themeColor);

        const params = new URLSearchParams(window.location.search);
        const concertId = params.get("concertId");

            navigateToConcert(concertId);

            window.location.href = "index.html";
            console.log("沒有帶參數");

            if (user) {

            }

            })
